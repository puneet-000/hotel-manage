<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Print Bill</title>
  <link rel="stylesheet" href="/static/css/billing.css">
  <style>
    @media print {
      .corner-home, .corner-history, .print-actions { display: none !important; }
      body.billing-page { margin: 0; max-width: none; }
      .bill-card { border: 0; }
    }
  </style>
</head>

<body class="billing-page">
  <a href="/" class="corner-home">Home</a>
  <a href="/billing" class="corner-history">Back</a>
  <a href="/billing_logout" class="corner-logout">Logout</a>

  <h1>Bill</h1>

  {% if not ok %}
    <div class="empty-note">{{ error or "Bill not found." }}</div>
  {% else %}
    <div class="bill-card">
      <div class="bill-head">
        <div class="bill-title">Table {{ table_id }}</div>
        <div class="print-actions">
          <a class="view-bill" href="#" onclick="window.print(); return false;">Print</a>
        </div>
      </div>

      <table>
        <tr>
          <th>Item</th>
          <th>Qty</th>
          <th>Price</th>
          <th>Total</th>
        </tr>
        {% for it in items %}
        <tr>
          <td>{{ it["food"] }}</td>
          <td>{{ it["qty"] }}</td>
          <td>₹{{ it["price"] }}</td>
          <td>₹{{ it["line_total"] }}</td>
        </tr>
        {% endfor %}
      </table>

      <div class="bill-total">Total: ₹{{ total }}</div>
    </div>
  {% endif %}
</body>
</html>
