<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Billing History</title>
  <link rel="stylesheet" href="/static/css/billing.css">
</head>

<body class="billing-page">
  <a href="/" class="corner-home">Home</a>
  <a href="/billing" class="corner-history">Back</a>
  <a href="/billing_logout" class="corner-logout">Logout</a>

  <h1>Billing History</h1>

  <div class="bill-card">
    <div class="history-filters" role="group" aria-label="History period">
      <a class="filter-link {% if period == 'day' %}is-active{% endif %}" href="/billing_history?period=day">1 Day</a>
      <a class="filter-link {% if period == 'week' %}is-active{% endif %}" href="/billing_history?period=week">1 Week</a>
      <a class="filter-link {% if period == 'year' %}is-active{% endif %}" href="/billing_history?period=year">1 Year</a>
    </div>
    <div class="bill-total">Grand Total: ₹{{ grand_total }}</div>
  </div>

  {% if rows %}
    <table>
      <tr>
        <th>ID</th>
        <th>Table</th>
        <th>Items</th>
        <th>Total</th>
        <th>View</th>
      </tr>
      {% for r in rows %}
      <tr>
        <td>{{ r["id"] }}</td>
        <td>{{ r["table_id"] }}</td>
        <td>{{ r["items"] }}</td>
        <td>₹{{ r["total"] }}</td>
        <td><a class="view-bill" href="/bill/{{ r['id'] }}">Open</a></td>
      </tr>
      {% endfor %}
    </table>
  {% else %}
    <div class="empty-note">No history yet.</div>
  {% endif %}
</body>
</html>
